# 1 backend, round-robin, DEFAULT proxy settings (this is the Q1(c) "before" config)
worker_processes auto;
events { worker_connections 1024; }

http {
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;

    upstream cognex_backends {
        server backend1:3000;
    }

    server {
        listen 80;
        location = /metrics { return 404; }   # Prometheus scrapes backends directly
        location / {
            proxy_pass http://cognex_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
