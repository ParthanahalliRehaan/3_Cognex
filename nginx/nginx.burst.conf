# BONUS Q1(d): cloud bursting. Normal load -> 3 local containers.
# When local capacity is exceeded (limit_conn -> 503) or all backends fail (502/503/504),
# the request is replayed against the deployed Cloudflare Worker.
worker_processes auto;
events { worker_connections 1024; }

http {
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log lb;

    limit_conn_zone $server_name zone=local_capacity:1m;
    limit_conn_status 503;
    resolver 127.0.0.11 valid=30s;          # Docker DNS, needed because @burst uses a variable

    upstream cognex_backends {
        server backend1:3000 max_fails=1 fail_timeout=10s;
        server backend2:3000 max_fails=1 fail_timeout=10s;
        server backend3:3000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        location = /metrics { return 404; }

        location / {
            limit_conn local_capacity 60;    # max concurrent requests held locally; tune below your measured capacity
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_pass http://cognex_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By local always;
            error_page 502 503 504 = @burst;
        }

        location @burst {
            set $burst_target https://cognex-worker.parthanahalli-rehaan.workers.dev;
            proxy_pass $burst_target;
            proxy_ssl_server_name on;
            proxy_set_header Host cognex-worker.parthanahalli-rehaan.workers.dev;
            add_header X-Served-By cloud-burst always;
        }
    }
}
