<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Syne+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <h1>COGNEX</h1>
      </div>
      <p class="tagline">Ask anything about any GitHub repository</p>
    </header>

    <section class="repo-bar">
      <div class="input-row">
        <input type="text" id="repoUrl" placeholder="https://github.com/vercel/next.js" autocomplete="off">
        <button id="ingestBtn">
          <span class="btn-icon">🗲</span>
          <span class="btn-text">BUILD GRAPH</span>
        </button>
      </div>
      <div class="hints">
        <span>Try:</span>
        <button class="hint-btn" data-repo="https://github.com/vercel/next.js">next.js</button>
        <button class="hint-btn" data-repo="https://github.com/facebook/react">react</button>
        <button class="hint-btn" data-repo="https://github.com/torvalds/linux">linux</button>
      </div>
      <div id="ingestStatus" class="status hidden"></div>
    </section>

    <main class="dashboard">
      <div class="chat-panel">
        <div class="panel-header">
          <span class="panel-dot"></span>
          <h2>CHAT</h2>
        </div>
        <div id="chatMessages" class="chat-messages">
          <div class="welcome">
            <div class="welcome-ascii">[>_]</div>
            <p>Enter a GitHub repo URL above, then ask me anything about it.</p>
            <div class="suggestions">
              <button class="suggestion" data-q="Who are the top contributors?">top contributors?</button>
              <button class="suggestion" data-q="What are the main dependencies?">dependencies?</button>
              <button class="suggestion" data-q="Explain the architecture">architecture?</button>
            </div>
          </div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Ask about this repo..." disabled autocomplete="off">
          <button id="sendBtn" disabled>➜</button>
        </div>
      </div>

      <div class="side-panels">
        <div class="graph-panel">
          <div class="panel-header">
            <span class="panel-dot"></span>
            <h2>GRAPH</h2>
          </div>
          <div id="graphViz" class="graph-viz">
            <div class="empty-state">
              <div class="empty-ascii">┌─┐<br>│ │<br>└─┘</div>
              <p>Build a graph first</p>
            </div>
          </div>
        </div>

        <div class="files-panel">
          <div class="panel-header">
            <span class="panel-dot"></span>
            <h2>FILES</h2>
          </div>
          <div id="filesList" class="files-list">
            <div class="empty-state">
              <div class="empty-ascii">📂</div>
              <p>No files yet</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>Powered by Groq · Cohere · Supabase · Cloudflare</p>
    </footer>
  </div>

  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
